<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1">
  <title>Arthur Defoin — Publicité Meta pour Photographes</title>
  <meta name="description" content="Media buyer spécialisé dans l'acquisition de clients pour les photographes. Je construis votre flux de réservations via publicité Meta.">
  <link rel="icon" type="image/png" href="landing/assets/favicon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&family=Manrope:wght@300;400;500;600;700&display=swap">

  <link rel="stylesheet" href="https://assets.calendly.com/assets/external/widget.css">
  <script src="https://assets.calendly.com/assets/external/widget.js" async></script>

  <!-- Studio + agenda CSS from existing design -->
  <link rel="stylesheet" href="landing/landing.css?v=133">
  <link rel="stylesheet" href="landing/landing-layouts.css?v=87">

  <script>
    history.scrollRestoration='manual';
    if(window.location.hash) history.replaceState(null,'',window.location.pathname+window.location.search);
    window.scrollTo(0,0);

  <!-- Meta Pixel -->

  <noscript><img height="1" width="1" style="display:none" src="https://www.facebook.com/tr?id=875967245522285&ev=PageView&noscript=1" alt=""/></noscript>

  <style>
    /* ── Design System ── */
    :root {
      --bg:       #F5F1E8;
      --bg-2:     #EDE8DC;
      --bg-card:  #E8E2D3;
      --ink:      #1C1A14;
      --ink-2:    #4A3F30;
      --gold:     #B8963E;
      --gold-2:   #CDA84F;
      --gold-bd:  #D4BA78;
      --gold-pale:#F0E4C0;
      --stone:    #8C7B60;
      --cream:    #FDFAF4;
      --serif:    'Cormorant Garamond', Georgia, serif;
      --sans:     'Manrope', system-ui, sans-serif;
      --r-pill:   50px;
      --r-card:   18px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: var(--sans);
      font-size: 16px;
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
    }

    .pg-container { max-width: 860px; margin: 0 auto; padding: 0 24px; }
    .pg-container-sm { max-width: 660px; margin: 0 auto; padding: 0 24px; }


    /* ── Strip ── */
    .pg-strip {
      background: var(--gold-pale);
      border-bottom: 1px solid var(--gold-bd);
      color: var(--ink-2);
      text-align: center;
      font-family: var(--sans);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.16em;
      padding: 9px 16px;
    }

    /* ── Nav ── */
    .pg-nav {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--bg);
      border-bottom: 1px solid var(--gold-bd);
      padding: 13px 0;
    }
    .pg-nav-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      max-width: 1060px;
      margin: 0 auto;
      padding: 0 24px;
    }
    .pg-nav-brand {
      display: flex; align-items: center; gap: 10px;
      text-decoration: none; color: var(--ink);
    }
    .pg-nav-logo { height: 30px; width: auto; }
    .pg-nav-name { font-size: 14px; font-weight: 600; letter-spacing: 0.01em; }
    .pg-nav-tag  { color: var(--stone); font-weight: 400; }
    .pg-btn-dark {
      background: var(--gold-pale); color: var(--ink);
      border: 1.5px solid var(--gold-bd); border-radius: var(--r-pill);
      padding: 10px 22px;
      font-family: var(--sans); font-size: 13px; font-weight: 600;
      letter-spacing: 0.04em; cursor: pointer;
      transition: background .18s;
    }
    .pg-btn-dark:hover { background: #e8d9a8; }

    /* ── Soleil discret sous le header ── */
    .pg-sun {
      text-align: center;
      font-size: 40px;
      line-height: 1;
      padding: 14px 0 6px;
      opacity: 1;
      user-select: none;
    }

    /* ── VSL ── */
    .pg-vsl { padding: 56px 0 0; }
    .pg-vsl-player {
      background: #111008;
      border-radius: var(--r-card);
      aspect-ratio: 16/9;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 18px; cursor: pointer;
    }
    .pg-vsl-play {
      width: 64px; height: 64px; border-radius: 50%;
      border: 1.5px solid var(--gold-bd);
      display: flex; align-items: center; justify-content: center;
    }
    .pg-vsl-play svg { width: 22px; height: 22px; fill: var(--gold-2); margin-left: 3px; }
    .pg-vsl-lbl {
      font-size: 11px; font-weight: 500; letter-spacing: .2em;
      color: var(--stone);
    }

    /* ── Hero ── */
    .pg-hero { padding: 48px 0 68px; text-align: center; }
    .pg-hero-badge {
      display: inline-block;
      border: 1px solid var(--gold-bd);
      border-radius: var(--r-pill);
      padding: 5px 18px;
      font-size: 11px; font-weight: 600; letter-spacing: .16em;
      color: var(--gold); margin-bottom: 26px;
    }
    .pg-hero-h1 {
      font-family: var(--serif);
      font-size: clamp(42px,7.5vw,82px);
      font-weight: 500; line-height: 1.06;
      margin-bottom: 22px;
    }
    .pg-hero-h1 em { font-style: italic; color: var(--gold); }
    .pg-hero-sub {
      font-size: 16px; line-height: 1.65;
      color: var(--ink-2);
      max-width: 480px; margin: 0 auto 34px;
    }
    .pg-btn-cta {
      display: inline-block;
      background: var(--gold-pale); color: var(--ink);
      border: 1.5px solid var(--gold-bd); border-radius: var(--r-pill);
      padding: 16px 38px;
      font-family: var(--sans); font-size: 15px; font-weight: 600;
      letter-spacing: .03em; cursor: pointer;
      text-decoration: none; transition: background .18s;
    }
    .pg-btn-cta:hover { background: #e8d9a8; animation: none; }
    @keyframes btn-breathe {
      0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(184,150,62,0); }
      50% { transform: scale(1.045); box-shadow: 0 4px 18px rgba(184,150,62,0.22); }
    }
    .pg-btn-cta { animation: btn-breathe 2.6s ease-in-out infinite; }
    .pg-btn-outline {
      display: inline-block;
      background: transparent; color: var(--ink);
      border: 1.5px solid var(--gold-bd); border-radius: var(--r-pill);
      padding: 14px 36px;
      font-family: var(--sans); font-size: 15px; font-weight: 600;
      letter-spacing: .03em; cursor: pointer;
      text-decoration: none; transition: background .18s;
    }
    .pg-btn-outline:hover { background: var(--gold-pale); }
    .pg-hero-stats {
      display: flex; justify-content: center; gap: 48px;
      margin-top: 48px; padding-top: 32px;
      border-top: 1px solid var(--gold-bd);
    }
    .pg-stat-num {
      display: block;
      font-family: var(--serif); font-size: 34px; font-weight: 500;
      color: var(--ink);
    }
    .pg-stat-lbl {
      font-size: 12px; color: var(--stone); letter-spacing: .04em;
    }

    /* ── Partner ── */
    .pg-partner { background: var(--bg-2); padding: 76px 0; }
    .pg-partner-who {
      display: flex; align-items: center; gap: 16px;
      margin-bottom: 32px;
    }
    .pg-avatar {
      width: 58px; height: 58px; border-radius: 50%;
      object-fit: cover; border: 2px solid var(--gold-bd);
      flex-shrink: 0;
    }
    .pg-partner-id-name { font-size: 16px; font-weight: 600; color: var(--ink); }
    .pg-partner-id-role { font-size: 13px; color: var(--stone); }
    .pg-eyebrow {
      font-size: 10px; font-weight: 600; letter-spacing: .2em;
      color: var(--gold); text-transform: uppercase;
      margin-bottom: 12px;
    }
    .pg-partner-h2 {
      font-family: var(--serif);
      font-size: clamp(34px,5vw,58px);
      font-weight: 500; line-height: 1.1;
      margin-bottom: 22px;
    }
    .pg-partner-h2 em { font-style: italic; color: var(--gold); }
    .pg-partner-body {
      font-size: 16px; line-height: 1.72;
      color: var(--ink-2); margin-bottom: 32px;
    }

    /* ── Eligibility teaser ── */
    .pg-eligib { padding: 80px 0; text-align: center; }
    .pg-eligib-title {
      font-family: var(--serif);
      font-size: clamp(28px,4.5vw,46px);
      font-weight: 500; line-height: 1.15;
      margin-bottom: 10px;
    }
    .pg-eligib-title em { font-style: italic; color: var(--gold); }
    .pg-eligib-sub { font-size: 14px; color: var(--stone); margin-bottom: 28px; }

    /* ── Modal ── */
    .pg-modal-overlay {
      position: fixed; inset: 0; z-index: 200;
      background: rgba(28,26,20,.55);
      backdrop-filter: blur(4px);
      display: flex; align-items: center; justify-content: center;
      padding: 16px;
      animation: fadeIn .2s ease;
    }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .pg-modal-card {
      background: var(--cream);
      border: 1px solid var(--gold-bd);
      border-radius: var(--r-card);
      width: 100%; max-width: 540px;
      max-height: 90vh; overflow-y: auto;
      padding: 36px;
      box-shadow: 0 24px 64px rgba(28,26,20,.18);
      position: relative;
      animation: slideUp .22s ease;
    }
    @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    .pg-modal-close {
      position: absolute; top: 16px; right: 16px;
      width: 32px; height: 32px; border-radius: 50%;
      background: var(--bg-2); border: none; cursor: pointer;
      font-size: 18px; line-height: 1; color: var(--stone);
      display: flex; align-items: center; justify-content: center;
      transition: background .15s;
    }
    .pg-modal-close:hover { background: var(--bg-card); color: var(--ink); }

    /* ── Funnel (inside modal) ── */
    .pg-progress { height: 3px; background: var(--bg-card); border-radius: 2px; margin-bottom: 28px; overflow: hidden; }
    .pg-progress-bar { height: 100%; background: var(--gold); border-radius: 2px; transition: width .4s ease; }
    .pg-step-eyebrow {
      font-size: 10px; font-weight: 600; letter-spacing: .2em;
      color: var(--stone); text-transform: uppercase; margin-bottom: 8px;
    }
    .pg-step-title {
      font-family: var(--serif);
      font-size: clamp(21px,3.5vw,28px);
      font-weight: 500; line-height: 1.25;
      margin-bottom: 20px;
    }
    .pg-framing {
      background: var(--gold-pale);
      border-left: 3px solid var(--gold);
      border-radius: 6px;
      padding: 13px 16px;
      font-size: 13px; line-height: 1.6;
      color: var(--ink-2); margin-bottom: 20px;
    }
    @keyframes pg-step-in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .pg-step-body { animation: pg-step-in .22s ease; }
    .pg-choices { display: flex; flex-direction: column; gap: 10px; }
    .pg-choice {
      -webkit-tap-highlight-color: transparent;
      display: flex; align-items: center;
      padding: 14px 18px;
      background: var(--bg);
      border: 1.5px solid var(--bg-card);
      border-radius: 12px; cursor: pointer;
      font-family: var(--sans); font-size: 14px;
      font-weight: 500; color: var(--ink);
      text-align: left; width: 100%;
      transition: border-color .18s, background .18s;
    }
    .pg-choice:hover        { border-color: var(--gold-bd); background: var(--gold-pale); }
    .pg-choice.is-selected  { border-color: var(--gold);    background: var(--gold-pale); }
    .pg-choice-lbl { display: block; font-weight: 600; }
    .pg-choice-desc { display: block; font-size: 12px; color: var(--stone); margin-top: 8px; font-weight: 400; }
    /* Cartes objectif avec tag CA */
    .pg-choice.has-tag { align-items: flex-start; flex-direction: column; padding: 16px 18px; gap: 0; }
    .pg-choice-tag {
      display: inline-block;
      background: var(--gold-pale); color: var(--gold);
      border: 1px solid var(--gold-bd); border-radius: 50px;
      font-size: 11px; font-weight: 700; letter-spacing: .05em;
      padding: 3px 10px; margin-bottom: 10px;
    }
    .pg-choice.is-selected .pg-choice-tag { background: var(--gold); color: var(--cream); border-color: var(--gold); }
    .pg-choice.has-tag .pg-choice-lbl { font-size: 15px; }
    .pg-choice.has-tag .pg-choice-desc { font-size: 12px; margin-top: 4px; }
    .pg-field { margin-bottom: 18px; }
    .pg-field-lbl {
      display: block; font-size: 11px; font-weight: 600;
      letter-spacing: .07em; text-transform: uppercase;
      color: var(--stone); margin-bottom: 6px;
    }
    .pg-field-input {
      width: 100%; padding: 13px 15px;
      background: var(--bg); border: 1.5px solid var(--bg-card);
      border-radius: 10px;
      font-family: var(--sans); font-size: 15px; color: var(--ink);
      outline: none; transition: border-color .18s;
    }
    .pg-field-input:focus { border-color: var(--gold); }
    .pg-field-input::placeholder { color: var(--stone); }
    .pg-next {
      margin-top: 20px; width: 100%; padding: 15px;
      background: var(--gold-pale); color: var(--ink);
      border: 1.5px solid var(--gold-bd); border-radius: var(--r-pill);
      font-family: var(--sans); font-size: 15px; font-weight: 600;
      cursor: pointer; transition: background .18s;
    }
    .pg-next:disabled { opacity: .36; cursor: not-allowed; }
    .pg-next:not(:disabled):hover { background: #e8d9a8; }
    .pg-back {
      margin-top: 12px; width: 100%; padding: 10px;
      background: transparent; color: var(--stone);
      border: none; font-family: var(--sans); font-size: 13px;
      cursor: pointer; text-align: center;
    }
    .pg-back:hover { color: var(--ink); }
    .pg-calendly-wrap { margin-top: 20px; }
    .pg-calendly-wrap .calendly-inline-widget { min-width: 100% !important; }

    /* ── Studio override (keep existing component, restyle bg) ── */
    .section.studio { background: var(--bg-2) !important; }
    .studio h2 em { color: var(--gold) !important; }
    .studio .eyebrow span:last-child { color: var(--gold) !important; letter-spacing: .14em; }
    .studio .rule { background: var(--gold-bd) !important; }

    /* ── Footer ── */
    .footer { background: var(--bg-2) !important; }
    .footer, .footer h4, .footer p, .footer li, .footer a { color: var(--ink-2) !important; }
    .footer .footer-brand .name { color: var(--ink) !important; font-weight: 600; }
    .footer a:hover { color: var(--gold) !important; }
    .footer-bottom { border-top-color: var(--gold-bd) !important; color: var(--stone) !important; }

    /* ── Mobile ── */
    html, body { overflow-x: hidden; }
    img { max-width: 100%; height: auto; }
    .footer-logo { max-width: 120px !important; height: auto !important; }
    .studio-logo-top { max-width: 180px !important; height: auto !important; }
    @media (max-width: 640px) {
      .pg-nav { display: none; }
      .pg-hero-stats { gap: 20px; flex-wrap: wrap; }
      .pg-partner-who { flex-direction: column; text-align: center; }
      .pg-funnel-card { padding: 22px 18px; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script src="landing/image-slot.js"></script>

  <script type="text/babel">
    const CALENDLY_URL = 'https://calendly.com/defoin-arthur/accompagnement-arthur';

    const goTo = id => { const el = document.getElementById(id); if (el) window.scrollTo({ top: el.offsetTop - 70, behavior: 'smooth' }); };

    // ─── Calendly inline embed ────────────────────────────────────────────────
    function CalendlyInline({ prefillName, prefillEmail }) {
      const ref = React.useRef(null);
      React.useEffect(() => {
        const init = () => {
          if (window.Calendly && ref.current) {
            ref.current.innerHTML = '';
            window.Calendly.initInlineWidget({
              url: CALENDLY_URL,
              parentElement: ref.current,
              prefill: { name: prefillName || '', email: prefillEmail || '' },
            });
          }
        };
        if (window.Calendly) { init(); }
        else {
          const t = setInterval(() => { if (window.Calendly) { clearInterval(t); init(); } }, 200);
          return () => clearInterval(t);
        }
      }, []);
      return <div ref={ref} className="pg-calendly-wrap" style={{ height: 660 }} />;
    }

    // ─── Modal ────────────────────────────────────────────────────────────────
    function Modal({ open, onClose, children }) {
      React.useEffect(() => {
        document.body.style.overflow = open ? 'hidden' : '';
        return () => { document.body.style.overflow = ''; };
      }, [open]);
      if (!open) return null;
      return (
        <div className="pg-modal-overlay" onClick={onClose}>
          <div className="pg-modal-card" onClick={e => e.stopPropagation()}>
            <button className="pg-modal-close" onClick={onClose} aria-label="Fermer">×</button>
            {children}
          </div>
        </div>
      );
    }

    // ─── Strip ───────────────────────────────────────────────────────────────
    function Strip() {
      return <div className="pg-strip">POUR LES PHOTOGRAPHES QUI VEULENT INVESTIR DANS LEUR ACQUISITION CLIENT</div>;
    }

    // ─── Nav ─────────────────────────────────────────────────────────────────
    function Nav({ openModal }) {
      return (
        <nav className="pg-nav">
          <div className="pg-nav-inner">
            <a className="pg-nav-brand" href="#top" onClick={e => { e.preventDefault(); window.scrollTo({ top: 0, behavior: 'smooth' }); }}>
              <img className="pg-nav-logo" src="landing/Logo A_.png" alt="Arthur Defoin" />
              <span className="pg-nav-name">Arthur Defoin · <span className="pg-nav-tag">Media Buyer</span></span>
            </a>
            <button className="pg-btn-dark" onClick={openModal}>Réserver mon appel</button>
          </div>
        </nav>
      );
    }

    // ─── Hero ─────────────────────────────────────────────────────────────────
    function HeroSection({ openModal }) {
      return (
        <>
          <section className="pg-vsl" id="top">
            <div className="pg-container-sm">
              <div className="pg-vsl-player">
                <div className="pg-vsl-play">
                  <svg viewBox="0 0 24 24"><polygon points="5,3 19,12 5,21" /></svg>
                </div>
                <span className="pg-vsl-lbl">VOTRE VSL — À VENIR</span>
              </div>
            </div>
          </section>

          <section className="pg-hero">
            <div className="pg-container-sm">
              <h1 className="pg-hero-h1">Photographes,<br /><em>je remplis votre agenda.</em></h1>
              <p className="pg-hero-sub">Media buyer spécialisé dans l'acquisition de clients pour les photographes. Je construis votre flux de réservations — du premier euro investi au créneau confirmé.</p>
              <button className="pg-btn-cta" onClick={openModal}>Je réserve mon appel découverte</button>
              <div className="pg-hero-stats">
                <div>
                  <span className="pg-stat-num">+6 000€</span>
                  <span className="pg-stat-lbl">de CA / mois</span>
                </div>
                <div>
                  <span className="pg-stat-num">+30</span>
                  <span className="pg-stat-lbl">clients / mois</span>
                </div>
              </div>
            </div>
          </section>
        </>
      );
    }

    // ─── Partner ─────────────────────────────────────────────────────────────
    function PartnerSection({ openModal }) {
      return (
        <section className="pg-partner">
          <div className="pg-container-sm">
            <div className="pg-partner-who">
              <img className="pg-avatar" src="landing/assets/arthur-studio.jpg" alt="Arthur Defoin" />
              <div>
                <div className="pg-partner-id-name">Arthur Defoin</div>
                <div className="pg-partner-id-role">Media buyer · Photographe</div>
              </div>
            </div>
            <div className="pg-eyebrow">Votre interlocuteur</div>
            <h2 className="pg-partner-h2">Votre partenaire,<br /><em>c'est moi.</em></h2>
            <p className="pg-partner-body">
              Media buyer depuis 2 ans, spécialisé dans les photographes professionnels. Je travaille <strong>seul</strong> — pas d'agence, pas de junior à qui déléguer. Vous échangez directement avec la personne qui crée, pilote et optimise vos campagnes, du premier euro investi au rendez-vous pris.<br /><br />
              Je suis moi-même photographe au studio Amour et Lumière. C'est en remplissant <em>notre propre</em> agenda grâce à la publicité Meta que j'ai compris ce qui fonctionne vraiment pour un photographe — et ce qui fait perdre du budget.
            </p>

      const pick = (key, val, el) => { if (el) el.blur(); setAns(a => ({ ...a, [key]: val })); next(); };

      const submit = async () => {
        setStatus('sending');

          await fetch('https://api.web3forms.com/submit', {

              subject: 'Qualification — photographe.arthurdefoin.com',
              name: form.prenom,

          if (typeof fbq === 'function') fbq('track', 'Lead', { content_name: 'Qualification photographe', currency: 'EUR', value: 0 });

        setStatus('done');

      return (
        <div>

            <div className="pg-progress-bar" style={{ width: pct + '%' }}></div>

          {step.eyebrow && <div className="pg-step-eyebrow">{step.eyebrow}</div>}
          <div className="pg-step-title">{step.title}</div>
          {step.framing && <div className="pg-framing">{step.framing}</div>}

          {step.type === 'text' && (
            <div>
              {step.fields.map(f => (
                <div className="pg-field" key={f.key}>
                  <label className="pg-field-lbl">{f.label}</label>
                  <input className="pg-field-input" type={f.type} placeholder={f.ph} autoFocus
                    value={textVals[f.key] || ''}
                    onChange={e => setTxt(t => ({ ...t, [f.key]: e.target.value }))}
                    onKeyDown={e => { if (e.key === 'Enter' && (textVals[f.key] || '').trim()) next(); }} />
                </div>
              ))}
              <button className="pg-next" onClick={next}
                disabled={!(textVals[step.fields[0].key] || '').trim()}>Suivant →</button>
            </div>
          )}

          {step.type === 'choice' && (
            <div className="pg-choices" key={step.key}>
              {step.options.map(o => (
                <button key={o.v}
                  className={"pg-choice" + (answers[step.key] === o.v ? ' is-selected' : '') + (o.tag ? ' has-tag' : '')}
                  onClick={e => pick(step.key, o.v, e.currentTarget)}>
                  {o.tag && <span className="pg-choice-tag">{o.tag}</span>}
                  <div>
                    <div className="pg-choice-lbl">{o.label}</div>
                    {o.desc && <div className="pg-choice-desc">{o.desc}</div>}
                  </div>
                </button>
              ))}
            </div>
          )}

          {step.type === 'contact' && (
            <div>
              {[
                { key: 'prenom',    label: 'Prénom',    type: 'text',  ph: 'Ex. Marie' },
                { key: 'telephone', label: 'Téléphone', type: 'tel',   ph: '06 xx xx xx xx' },

              </button>
            </div>
          )}

          </div>
          {idx > 0 && <button className="pg-back" onClick={back}>← Retour</button>}
        </div>
      );

  <!-- Pixel tracking -->
  <script>
    (function () {
      var fire = function (name, params) { if (typeof fbq === 'function') fbq('track', name, params || {}); };
      var vcFired = false, tries = 0;
      var poll = setInterval(function () {
        var el = document.getElementById('funnel');
        if (el && 'IntersectionObserver' in window) {
          clearInterval(poll);
          new IntersectionObserver(function (entries) {
            entries.forEach(function (en) { if (en.isIntersecting && !vcFired) { vcFired = true; fire('ViewContent', { content_name: 'Funnel qualification photographe' }); } });
          }, { threshold: 0.3 }).observe(el);
        } else if (++tries > 40) clearInterval(poll);
      }, 250);
      window.addEventListener('message', function (e) {
        if (e.data && e.data.event === 'calendly.event_scheduled') {
          fire('Lead', { content_name: 'Appel Calendly', currency: 'EUR', value: 0 });
        }
      });
    })();
  </script>
