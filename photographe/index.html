<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1">
  <title>Arthur Defoin — Publicité Meta pour Photographes</title>
  <meta name="description" content="Media buyer spécialisé dans l'acquisition de clients pour les photographes. Je construis votre flux de réservations via publicité Meta.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&family=Manrope:wght@300;400;500;600;700&display=swap">

  <!-- Studio + agenda CSS from existing design -->
  <link rel="stylesheet" href="landing/landing.css?v=133">
  <link rel="stylesheet" href="landing/landing-layouts.css?v=87">

  <script>
    history.scrollRestoration='manual';
    if(window.location.hash) history.replaceState(null,'',window.location.pathname+window.location.search);
    window.scrollTo(0,0);
  </script>

  <!-- Meta Pixel -->
  <script>
    !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,document,'script','https://connect.facebook.net/en_US/fbevents.js');

  <noscript><img height="1" width="1" style="display:none" src="https://www.facebook.com/tr?id=875967245522285&ev=PageView&noscript=1" alt=""/></noscript>

  <style>
    /* ── Design System ── */
    :root {
      --bg:       #FBF5EC;
      --bg-2:     #F1E7DA;
      --bg-card:  #E7DACB;
      --ink:      #14100D;
      --ink-2:    #2B221B;
      --gold:     #9A7B43;
      --gold-2:   #C9A86A;
      --gold-bd:  #D9BE89;
      --gold-pale:#E8D3AC;
      --stone:    #8A7665;
      --cream:    #FBF5EC;
      --serif:    'Cormorant Garamond', Georgia, serif;
      --sans:     'Manrope', system-ui, sans-serif;
      --r-pill:   50px;
      --r-card:   18px;
      --shadow-gold: 0 14px 38px -10px rgba(154,123,67,.42);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: var(--sans);
      font-size: 16px;
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
    }

    .pg-container { max-width: 860px; margin: 0 auto; padding: 0 24px; }
    .pg-container-sm { max-width: 660px; margin: 0 auto; padding: 0 24px; }


    /* ── Strip ── */
    .pg-strip {
      background: linear-gradient(90deg, var(--bg), var(--bg-2) 50%, var(--bg));
      border-bottom: 1px solid var(--bg-card);
      color: var(--gold);
      text-align: center;
      font-family: var(--sans);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.22em;
      padding: 11px 16px;
    }


    /* ── VSL ── */
    .pg-vsl { padding: 56px 0 0; }
    .pg-vsl-player {
      background: #111008;
      border-radius: var(--r-card);
      aspect-ratio: 16/9;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 18px; cursor: pointer;
    }
    .pg-vsl-play {
      width: 64px; height: 64px; border-radius: 50%;
      border: 1.5px solid var(--gold-bd);
      display: flex; align-items: center; justify-content: center;
    }
    .pg-vsl-play svg { width: 22px; height: 22px; fill: var(--gold-2); margin-left: 3px; }
    .pg-vsl-lbl {
      font-size: 11px; font-weight: 500; letter-spacing: .2em;
      color: var(--stone);
    }

    /* ── Hero ── */
    .pg-hero { padding: 48px 0 68px; text-align: center; }
    .pg-hero-badge {
      display: inline-block;
      border: 1px solid var(--gold-bd);
      border-radius: var(--r-pill);
      padding: 5px 18px;
      font-size: 11px; font-weight: 600; letter-spacing: .16em;
      color: var(--gold); margin-bottom: 26px;
    }
    .pg-hero-h1 {
      font-family: var(--serif);
      font-size: clamp(42px,7.5vw,82px);
      font-weight: 500; line-height: 1.06;
      margin-bottom: 22px;
    }
    .pg-hero-h1 em { font-style: italic; color: var(--gold); }
    .pg-hero-sub {
      font-size: 16px; line-height: 1.65;
      color: var(--ink-2);
      max-width: 480px; margin: 0 auto 34px;
    }
    @keyframes btn-glow {
      0%, 100% { box-shadow: 0 0 0 0 rgba(154,123,67,0), var(--shadow-gold); }
      50%       { box-shadow: 0 0 0 8px rgba(154,123,67,.16), var(--shadow-gold); }
    }
    .pg-btn-cta {
      display: inline-flex; align-items: center; justify-content: center;
      background: var(--gold-pale); color: var(--ink);
      border: 1px solid var(--gold-2); border-radius: var(--r-pill);
      padding: 0 38px; height: 60px;
      font-family: var(--sans); font-size: 15px; font-weight: 600;
      letter-spacing: .02em; cursor: pointer;
      text-decoration: none;
      box-shadow: var(--shadow-gold);
      animation: btn-glow 2.4s ease-in-out infinite;
      transition: filter .15s, transform .1s;
    }
    .pg-btn-cta:hover { filter: brightness(1.04); animation: none; box-shadow: var(--shadow-gold); }
    .pg-btn-cta:active { transform: scale(.975); }
    .pg-btn-outline {
      display: inline-flex; align-items: center; justify-content: center;
      background: transparent; color: var(--ink);
      border: 1.5px solid var(--gold-bd); border-radius: var(--r-pill);
      padding: 0 36px; height: 54px;
      font-family: var(--sans); font-size: 15px; font-weight: 600;
      letter-spacing: .02em; cursor: pointer;
      text-decoration: none; transition: background .18s, filter .15s;
    }
    .pg-btn-outline:hover { background: var(--gold-pale); }
    .pg-hero-stats {
      display: flex; justify-content: center; gap: 48px;
      margin-top: 48px; padding-top: 32px;
      border-top: 1px solid var(--gold-bd);
    }
    .pg-stat-num {
      display: block;
      font-family: var(--serif); font-size: 34px; font-weight: 500;
      color: var(--gold);
    }
    .pg-stat-lbl {
      font-size: 12px; color: var(--stone); letter-spacing: .04em;
    }

    /* ── Partner ── */
    .pg-partner { background: var(--bg-2); padding: 76px 0; }
    .pg-partner-who {
      display: flex; align-items: center; gap: 16px;
      margin-bottom: 32px;
    }
    .pg-avatar {
      width: 58px; height: 58px; border-radius: 50%;
      object-fit: cover; border: 2px solid var(--gold-bd);
      flex-shrink: 0;
    }
    .pg-partner-id-name { font-size: 16px; font-weight: 600; color: var(--ink); }
    .pg-partner-id-role { font-size: 13px; color: var(--stone); }
    .pg-eyebrow {
      font-size: 10px; font-weight: 600; letter-spacing: .2em;
      color: var(--gold); text-transform: uppercase;
      margin-bottom: 12px;
    }
    .pg-partner-h2 {
      font-family: var(--serif);
      font-size: clamp(34px,5vw,58px);
      font-weight: 500; line-height: 1.1;
      margin-bottom: 22px;
    }
    .pg-partner-h2 em { font-style: italic; color: var(--gold); }
    .pg-partner-body {
      font-size: 16px; line-height: 1.72;
      color: var(--ink-2); margin-bottom: 32px;
    }

    /* ── Eligibility teaser ── */
    .pg-eligib { padding: 80px 0; text-align: center; }
    .pg-eligib-title {
      font-family: var(--serif);
      font-size: clamp(28px,4.5vw,46px);
      font-weight: 500; line-height: 1.15;
      margin-bottom: 10px;
    }
    .pg-eligib-title em { font-style: italic; color: var(--gold); }
    .pg-eligib-sub { font-size: 14px; color: var(--stone); margin-bottom: 28px; }

    /* ── Modal ── */
    .pg-modal-overlay {
      position: fixed; inset: 0; z-index: 200;
      background: rgba(20,16,13,.72);
      backdrop-filter: blur(4px);
      display: flex; align-items: flex-start; justify-content: center;
      padding: clamp(12px,3vw,24px); overflow-y: auto;
      animation: fadeIn .24s ease;
    }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .pg-modal-card {
      background: #FBF5EC;
      border-radius: var(--r-card);
      width: 100%; max-width: 560px;
      padding: clamp(24px,5vw,40px);
      box-shadow: 0 32px 80px -20px rgba(20,16,13,.4);
      position: relative; margin: auto;
      animation: slideUp .3s ease;
    }
    @keyframes slideUp { from { transform: translateY(28px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    .pg-modal-close {
      position: absolute; top: 16px; right: 16px;
      width: 32px; height: 32px; border-radius: 50%;
      background: var(--bg-2); border: none; cursor: pointer;
      font-size: 18px; line-height: 1; color: var(--stone);
      display: flex; align-items: center; justify-content: center;
      transition: background .15s;
    }
    .pg-modal-close:hover { background: var(--bg-card); color: var(--ink); }

    /* ── Funnel (inside modal) ── */
    .pg-funnel-nav {
      display: flex; align-items: center; gap: 16px;
      margin-bottom: 8px; min-height: 48px;
    }
    .pg-btn-back {
      display: grid; place-items: center;
      width: 40px; height: 40px; flex: none; border-radius: 50%;
      border: 1px solid #DAC9B4; background: #ffffff;
      color: var(--ink-2); cursor: pointer; transition: all 150ms;
    }
    .pg-btn-back:hover { background: #F1E7DA; }
    .pg-progress-wrap { flex: 1; }
    .pg-progress-label { font-size: 12px; color: var(--stone); margin-bottom: 8px; }
    .pg-progress { height: 3px; background: #E7DACB; border-radius: 2px; overflow: hidden; }
    .pg-progress-bar { height: 100%; background: #E8D3AC; border-radius: 2px; transition: width .4s ease; }
    .pg-step-eyebrow {
      font-size: 10px; font-weight: 600; letter-spacing: .2em;
      color: var(--gold); text-transform: uppercase; margin-bottom: 10px;
    }
    .pg-step-title {
      font-family: var(--serif);
      font-size: clamp(24px,3.5vw,36px);
      font-weight: 500; line-height: 1.1;
      margin-bottom: 20px; letter-spacing: -.01em;
    }
    .pg-framing {
      font-size: 16px; line-height: 1.6;
      color: var(--stone); margin-bottom: 20px;
    }
    @keyframes pg-step-in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .pg-step-body { animation: pg-step-in .22s ease; }
    .pg-choices { display: flex; flex-direction: column; gap: 10px; }
    .pg-choice {
      -webkit-tap-highlight-color: transparent;
      display: flex; align-items: center; gap: 14px;
      padding: 16px 18px;
      background: #ffffff;
      border: 1.5px solid #E7DACB; border-radius: 14px;
      cursor: pointer; text-align: left; width: 100%;
      font-family: var(--sans);
      transition: border-color .18s, background .18s, box-shadow .18s;
    }
    .pg-choice:hover { border-color: var(--gold-2); background: #FBF5EC; }
    .pg-choice.is-selected {
      border-color: var(--gold); background: #FBF5EC;
      box-shadow: 0 0 0 4px rgba(184,150,62,.13);
    }
    .pg-choice-icon {
      display: grid; place-items: center; flex: none;
      width: 44px; height: 44px; border-radius: 10px;
      background: #F1E7DA; color: var(--gold);
      transition: background .18s;
    }
    .pg-choice.is-selected .pg-choice-icon { background: #E8D3AC; }
    .pg-choice-body { flex: 1; }
    .pg-choice-lbl { display: block; font-size: 15px; font-weight: 600; color: var(--ink); line-height: 1.3; }
    .pg-choice-desc { display: block; font-size: 12px; color: var(--stone); margin-top: 3px; font-weight: 400; }
    .pg-choice-radio {
      width: 22px; height: 22px; flex: none; border-radius: 50%;
      border: 1.5px solid var(--gold-bd);
      display: grid; place-items: center;
      background: var(--bg); transition: all .18s;
    }
    .pg-choice.is-selected .pg-choice-radio { border-color: var(--gold); background: var(--gold); }
    .pg-choice-radio-dot {
      width: 8px; height: 8px; border-radius: 50%; background: #fff;
      transform: scale(0); transition: transform .18s;
    }
    .pg-choice.is-selected .pg-choice-radio-dot { transform: scale(1); }
    .pg-field { margin-bottom: 18px; }
    .pg-field-lbl {
      display: block; font-size: 11px; font-weight: 600;
      letter-spacing: .07em; text-transform: uppercase;
      color: var(--stone); margin-bottom: 6px;
    }
    .pg-field-input {
      width: 100%; padding: 13px 15px;
      background: var(--bg); border: 1.5px solid var(--bg-card);
      border-radius: 10px;
      font-family: var(--sans); font-size: 15px; color: var(--ink);
      outline: none; transition: border-color .18s;
    }
    .pg-field-input:focus { border-color: var(--gold); }
    .pg-field-input::placeholder { color: var(--stone); }
    .pg-next {
      margin-top: 20px; width: 100%; padding: 15px;
      background: var(--gold-pale); color: var(--ink);
      border: 1.5px solid var(--gold-bd); border-radius: var(--r-pill);
      font-family: var(--sans); font-size: 15px; font-weight: 600;
      cursor: pointer; transition: background .18s;
    }
    .pg-next:disabled { opacity: .36; cursor: not-allowed; }
    .pg-next:not(:disabled):hover { background: #e8d9a8; }
    .pg-back {
      margin-top: 12px; width: 100%; padding: 10px;
      background: transparent; color: var(--stone);
      border: none; font-family: var(--sans); font-size: 13px;
      cursor: pointer; text-align: center;
    }
    .pg-back:hover { color: var(--ink); }

    /* ── Studio override (keep existing component, restyle bg) ── */
    .section.studio { background: var(--bg-2) !important; }
    .agenda-cal { background: #ffffff !important; }
    .studio h2 em { color: var(--gold) !important; }
    .studio .eyebrow span:last-child { color: var(--gold) !important; letter-spacing: .14em; }
    .studio .rule { background: var(--gold-bd) !important; }

    /* ── Footer ── */
    .footer { background: var(--bg-2) !important; }
    .footer, .footer h4, .footer p, .footer li, .footer a { color: var(--ink-2) !important; }
    .footer .footer-brand .name { color: var(--ink) !important; font-weight: 600; }
    .footer a:hover { color: var(--gold) !important; }
    .footer-bottom { border-top-color: var(--gold-bd) !important; color: var(--stone) !important; }

    /* ── Mobile ── */
    html, body { overflow-x: hidden; }
    img { max-width: 100%; height: auto; }
    .footer-logo { max-width: 120px !important; height: auto !important; }
    .studio-logo-top { max-width: 180px !important; height: auto !important; }
    @media (max-width: 640px) {
      .pg-hero-stats { gap: 20px; flex-wrap: wrap; }
      .pg-partner-who { flex-direction: column; text-align: center; }
      .pg-funnel-card { padding: 22px 18px; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script src="landing/image-slot.js"></script>

  <script type="text/babel">
    const goTo = id => { const el = document.getElementById(id); if (el) window.scrollTo({ top: el.offsetTop - 70, behavior: 'smooth' }); };

    // ─── Modal ────────────────────────────────────────────────────────────────
    function Modal({ open, onClose, children }) {
      React.useEffect(() => {
        document.body.style.overflow = open ? 'hidden' : '';
        return () => { document.body.style.overflow = ''; };
      }, [open]);
      if (!open) return null;
      return (
        <div className="pg-modal-overlay" onClick={onClose}>
          <div className="pg-modal-card" onClick={e => e.stopPropagation()}>
            <button className="pg-modal-close" onClick={onClose} aria-label="Fermer">×</button>
            {children}
          </div>
        </div>
      );
    }

    // ─── Strip ───────────────────────────────────────────────────────────────
    function Strip() {
      return <div className="pg-strip">POUR LES PHOTOGRAPHES QUI VEULENT INVESTIR DANS LEUR ACQUISITION CLIENT</div>;
    }

    // ─── Nav ─────────────────────────────────────────────────────────────────

    // ─── Hero ─────────────────────────────────────────────────────────────────
    function HeroSection({ openModal }) {
      return (
        <>
          <section className="pg-vsl" id="top">
            <div className="pg-container-sm">
              <div className="pg-vsl-player">
                <div className="pg-vsl-play">
                  <svg viewBox="0 0 24 24"><polygon points="5,3 19,12 5,21" /></svg>
                </div>
                <span className="pg-vsl-lbl">VOTRE VSL — À VENIR</span>
              </div>
            </div>
          </section>

          <section className="pg-hero">
            <div className="pg-container-sm">
              <h1 className="pg-hero-h1">Photographes,<br /><em>je remplis votre agenda.</em></h1>
              <p className="pg-hero-sub">Media buyer spécialisé dans l'acquisition de clients pour les photographes. Je construis votre flux de réservations — du premier euro investi au créneau confirmé.</p>
              <button className="pg-btn-cta" onClick={openModal}>Je réserve mon appel découverte</button>
              <div className="pg-hero-stats">
                <div>
                  <span className="pg-stat-num">+30</span>
                  <span className="pg-stat-lbl">clients / mois en moyenne</span>
                </div>
                <div>
                  <span className="pg-stat-num">+6 000€</span>
                  <span className="pg-stat-lbl">de CA / mois en moyenne</span>
                </div>
                <div>
                  <span className="pg-stat-num">+44</span>
                  <span className="pg-stat-lbl">photographes accompagnés</span>
                </div>
              </div>
            </div>
          </section>
        </>
      );
    }

    // ─── Partner ─────────────────────────────────────────────────────────────
    function PartnerSection({ openModal }) {
      return (
        <section className="pg-partner">
          <div className="pg-container-sm">
            <div className="pg-partner-who">
              <img className="pg-avatar" src="landing/assets/arthur-studio.jpg" alt="Arthur Defoin" />
              <div>
                <div className="pg-partner-id-name">Arthur Defoin</div>
                <div className="pg-partner-id-role">Media buyer · Photographe</div>
              </div>
            </div>
            <div className="pg-eyebrow">Votre interlocuteur</div>
            <h2 className="pg-partner-h2">Votre partenaire,<br /><em>c'est moi.</em></h2>
            <p className="pg-partner-body">
              Mes clients photographes passent en moyenne de 5 à 30 réservations par mois — sans prospecter, sans relancer, sans changer leur tarif. Juste un flux régulier de clients qui viennent à eux.<br /><br />
              Je suis moi-même photographe au studio Amour et Lumière. C'est en remplissant <em>notre propre</em> agenda avec Meta Ads que j'ai appris ce qui génère de vraies séances — et ce qui brûle du budget sans résultat.
            </p>
            <button className="pg-btn-outline" onClick={openModal}>Vérifier mon éligibilité →</button>
          </div>
        </section>
      );
    }

    // ─── Qualification Funnel ─────────────────────────────────────────────────
    const IC = {
      camera:  `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3Z"/><circle cx="12" cy="13" r="3"/></svg>`,
      heart:   `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>`,
      sun:     `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>`,
      grid:    `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>`,
      seed:    `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 20s-3-7 2-12 9-2 9-2 1 7-4 12-7 2-7 2Z"/><path d="M7 20c-1-3 0-6 2-8"/></svg>`,

    function QualifFunnel() {
      const [idx, setIdx]       = React.useState(0);
      const [answers, setAns]   = React.useState({});
      const [textVals, setTxt]  = React.useState({});
      const [form, setForm]     = React.useState({ prenom: '', telephone: '', email: '' });
      const [status, setStatus] = React.useState('idle');
      const [disq, setDisq]     = React.useState(false);

      const step = STEPS[idx];
      const pct  = Math.min(100, (idx / (STEPS.length - 1)) * 100);

      const next = () => setIdx(i => Math.min(STEPS.length - 1, i + 1));
      const back = () => { setDisq(false); setIdx(i => Math.max(0, i - 1)); };

      const pick = (key, val, el) => {
        if (el) el.blur();
        if (key === 'engagement' && val === 'non') { setAns(a => ({ ...a, [key]: val })); setDisq(true); return; }
        setAns(a => ({ ...a, [key]: val })); next();
      };

      const submit = async () => {
        setStatus('sending');
        try {
          await fetch('https://api.web3forms.com/submit', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              access_key: '8ff579b2-c217-4683-95bf-49ccd0b57c4d',
              subject: 'Qualification — photographe.arthurdefoin.com',
              name: form.prenom,
              email: form.email,
              phone: form.telephone,
              message: Object.entries({ ...textVals, ...answers }).map(([k, v]) => `${k}: ${v}`).join('\n'),
            }),
          });
          if (typeof fbq === 'function') fbq('track', 'Lead', { content_name: 'Qualification photographe', currency: 'EUR', value: 0 });
        } catch (_) {}
        setStatus('done');
      };

      if (disq) {
        return (
          <div style={{ padding: '8px 4px 24px' }}>
            <button onClick={back} style={{ background: 'none', border: 'none', cursor: 'pointer', marginBottom: 28, display: 'flex', alignItems: 'center', justifyContent: 'center', width: 36, height: 36, borderRadius: '50%', border: '1.5px solid var(--gold-bd)' }}>

              J'ai compris et je souhaite investir →
            </button>
          </div>
        );

        return (
          <div style={{ textAlign: 'center', padding: '48px 24px 40px' }}>

                </button>

              {step.footnote && <p style={{ fontFamily: 'var(--sans)', fontSize: 11, color: 'var(--stone)', marginTop: 10, letterSpacing: '.03em' }}>{step.footnote}</p>}

              <button className="pg-next" onClick={submit}
                disabled={status === 'sending' || !form.prenom.trim() || !form.telephone.trim() || !form.email.trim()}>
                {status === 'sending' ? 'Envoi…' : 'Accéder au calendrier →'}
              </button>
            </div>
          )}

          </div>
        </div>
      );
    }

  <!-- Pixel tracking -->
  <script>
    (function () {
      var fire = function (name, params) { if (typeof fbq === 'function') fbq('track', name, params || {}); };
      var vcFired = false, tries = 0;
      var poll = setInterval(function () {
        var el = document.getElementById('funnel');
        if (el && 'IntersectionObserver' in window) {
          clearInterval(poll);
          new IntersectionObserver(function (entries) {
            entries.forEach(function (en) { if (en.isIntersecting && !vcFired) { vcFired = true; fire('ViewContent', { content_name: 'Funnel qualification photographe' }); } });
          }, { threshold: 0.3 }).observe(el);
        } else if (++tries > 40) clearInterval(poll);
      }, 250);
    })();
  </script>
