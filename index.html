    // ─── useTweaks (minimal — tweaks panel not shown in production) ───────────
    function useTweaks(defaults) {
      const [values, setValues] = React.useState(defaults);
      const setTweak = React.useCallback((keyOrEdits, val) => {
        const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null ? keyOrEdits : { [keyOrEdits]: val };
        setValues((prev) => ({ ...prev, ...edits }));
      }, []);
      return [values, setTweak];
    }
    // Stub tweaks panel — never shown in production (no __activate_edit_mode posted)
    function TweaksPanel() { return null; }
    function TweakSection() { return null; }
    function TweakSelect() { return null; }

    // ─── Nav ─────────────────────────────────────────────────────────────────
    function Nav({ ctaLabel = 'Tester le simulateur' }) {
      const [scrolled, setScrolled] = React.useState(false);
      const [open, setOpen] = React.useState(false);
      React.useEffect(() => {
        const onScroll = () => setScrolled(window.scrollY > 24);
        window.addEventListener('scroll', onScroll, { passive: true });
        onScroll();
        return () => window.removeEventListener('scroll', onScroll);
      }, []);
      React.useEffect(() => { if (window.lucide) window.lucide.createIcons(); }, [open]);
      const go = (id) => (e) => {
        e.preventDefault(); setOpen(false);
        const el = document.getElementById(id);
        if (el) window.scrollTo({ top: el.offsetTop - 60, behavior: 'smooth' });
      };
      return (
        <nav className={"nav" + (scrolled ? " scrolled" : "") + (open ? " menu-open" : "")}>
          <div className="container">
            <div className="nav-inner">
              <a className="nav-brand" href="#top" onClick={go('top')}>
                <img className="nav-logo" src="landing/Logo A_.png" alt="Arthur Defoin" />
                <span className="brand-text">
                  <span className="name">Arthur Defoin · <span className="nav-tag">Media Buyer</span></span>
                </span>
              </a>
              <div className="nav-links">
                <a onClick={go('mecanisme')}>Le mécanisme</a>
                <a onClick={go('simulateur')}>Simulateur</a>

                <i data-lucide={open ? 'x' : 'menu'}></i>
              </button>
            </div>
          </div>
        </nav>
      );

    // ─── SideRail ────────────────────────────────────────────────────────────
    function SideRail() {
      const sections = [
        { id: 'top', n: '01' },
        { id: 'mecanisme', n: '02' },
        { id: 'simulateur', n: '03' },
        { id: 'studio', n: '04' },
      ];
      const [active, setActive] = React.useState('top');
      React.useEffect(() => {
        const onScroll = () => {
          const y = window.scrollY + 200;
          let cur = sections[0].id;
          for (const s of sections) { const el = document.getElementById(s.id); if (el && el.offsetTop <= y) cur = s.id; }
          setActive(cur);
        };
        window.addEventListener('scroll', onScroll, { passive: true });
        onScroll();
        return () => window.removeEventListener('scroll', onScroll);
      }, []);
      return (
        <div className="side-rail" aria-hidden="true">
          {sections.map(s => (
            <a key={s.id} className={active === s.id ? 'active' : ''}
               onClick={e => { e.preventDefault(); const el = document.getElementById(s.id); if (el) window.scrollTo({ top: el.offsetTop - 60, behavior: 'smooth' }); }}>
              {s.n}
            </a>
          ))}
        </div>
      );
    }

    function Dot() {

    let _simSnapshot = {};

    // ─── Simulateur ───────────────────────────────────────────────────────────
    const CPL = 12, PANIER_SEUIL = 300, PUB_MIN = 100, PUB_MAX = 3500, PUB_DEFAUT = 500;
    const SIM_SPECIALITES = ['Mariage','Studio','Extérieur'];
    const convForSpec = (s, cart) => {
      if (s !== 'Mariage') return 40;
      return 10;
    };
    const PANIER_PAR_SPEC = { Mariage: 1500 };
    const panierForSpec = s => PANIER_PAR_SPEC[s] ?? 200;
    function calcAbo(pub) {
      if (pub <= 390) return 390;
      if (pub <= 490) return pub;
      return 490 + (pub - 490) * 0.15;
    }
    function useCounterSim(value, duration=480) {
      const [display, setDisplay] = React.useState(value);
      const ref = React.useRef({from:value,to:value,start:0});
      React.useEffect(() => {
        ref.current = {from:display,to:value,start:performance.now()};
        let raf;
        const tick = t => {
          const {from,to,start} = ref.current;
          const k = Math.min(1,(t-start)/duration);
          const eased = 1-Math.pow(1-k,3);
          setDisplay(from+(to-from)*eased);
          if (k<1) raf = requestAnimationFrame(tick);
        };
        raf = requestAnimationFrame(tick);
        return () => cancelAnimationFrame(raf);
      }, [value]);
      return display;
    }
    const fmtEUR = n => new Intl.NumberFormat('fr-FR',{maximumFractionDigits:0}).format(Math.round(n))+' €';
    const fmtX = n => '× '+new Intl.NumberFormat('fr-FR',{minimumFractionDigits:1,maximumFractionDigits:1}).format(n);
    const fmtInt = n => new Intl.NumberFormat('fr-FR',{maximumFractionDigits:0}).format(Math.round(n));
    function SimSlider({value,min,max,step=1,onChange,ticks}) {
      const trackRef = React.useRef(null);
      const pct = (value-min)/(max-min)*100;

      const valueFromPointer = (e) => {
        const rect = trackRef.current.getBoundingClientRect();
        const clientX = e.clientX;
        const ratio = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
        const raw = min + ratio * (max - min);
        const stepped = Math.round(raw / step) * step;
        return Math.max(min, Math.min(max, stepped));
      };

      const onPointerDown = (e) => {
        e.preventDefault();
        trackRef.current.setPointerCapture(e.pointerId);
        onChange(valueFromPointer(e));
      };

      const onPointerMove = (e) => {
        if (!trackRef.current.hasPointerCapture(e.pointerId)) return;
        onChange(valueFromPointer(e));
      };

      return (
        <div>
          <div className="sim-slider" ref={trackRef}
               onPointerDown={onPointerDown}
               onPointerMove={onPointerMove}
               style={{touchAction:'none', userSelect:'none'}}>
            <div className="sim-track"><div className="sim-fill" style={{width:pct+'%'}}></div></div>
            <div className="sim-thumb" style={{left:pct+'%'}}></div>
          </div>
          {ticks && <div className="sim-ticks">{ticks.map((t,i) => <span key={i}>{t}</span>)}</div>}
        </div>
      );
    }
    // ─── Flying-to-panel animation ───────────────────────────────────────────
    function flyToPanel(sourceEl) {
      if (!sourceEl) return;
      const sr = sourceEl.getBoundingClientRect();
      const cx = sr.left + sr.width / 2;
      const cy = sr.top  + sr.height / 2;
      const ghost = document.createElement('div');
      ghost.style.cssText = [
        'position:fixed',
        `left:${cx - 56}px`,
        `top:${cy - 13}px`,
        'width:112px',
        'height:26px',
        'border-radius:20px',
        'background:linear-gradient(135deg,#9B4F72,#C4668A,#EBC4D5)',
        'box-shadow:0 6px 20px rgba(155,79,114,0.45)',
        'z-index:9999',
        'pointer-events:none',
        'opacity:1',
        'transform:scale(1)',
      ].join(';');
      document.body.appendChild(ghost);
      requestAnimationFrame(() => requestAnimationFrame(() => {
        ghost.style.transition = [
          'left 0.6s cubic-bezier(0.76,0,0.24,1)',
          'top 0.6s cubic-bezier(0.76,0,0.24,1)',
          'transform 0.55s cubic-bezier(0.34,1.56,0.64,1)',
          'opacity 0.3s ease 0.32s',
          'box-shadow 0.4s ease',
          'width 0.4s ease 0.05s',
          'height 0.4s ease 0.05s',
          'border-radius 0.35s ease',
        ].join(',');
        ghost.style.left = '22px';
        ghost.style.top = '126px';
        ghost.style.width = '140px';
        ghost.style.height = '22px';
        ghost.style.borderRadius = '8px';
        ghost.style.transform = 'scale(0.82)';
        ghost.style.opacity = '0';
        ghost.style.boxShadow = '0 2px 8px rgba(155,79,114,0.15)';
        setTimeout(() => ghost.remove(), 850);
      }));
    }
    // ─── Panel "Besoin" fixe ──────────────────────────────────────────────────
    function NeedsPanel({ clients, lpChoice }) {
      const hasClients = !!clients;
      const hasLp = !!lpChoice;
      const visible = hasClients || hasLp;
      return (
        <div className={"needs-panel" + (visible ? " visible" : "")}>
          <div className="needs-panel-title">Objectif &amp; Besoin</div>
          <div className={"needs-item" + (hasClients ? " np-visible" : "")}>
            <span className="needs-check">✓</span>
            <span>+{clients} clients</span>
          </div>
          <div className={"needs-item needs-item-lp" + (hasLp ? " np-visible" : "")}>
            <span className={"needs-check" + (lpChoice === 'have' ? " needs-x" : "")}>
              {lpChoice === 'have' ? '✗' : '✓'}
            </span>
            <span>Landing page</span>
          </div>
        </div>
      );
    }
    function Simulateur({onSimChange, onCtaClick, onClientConfirm}) {
      const [spec, setSpec] = React.useState('Studio');
      const [cart, setCart] = React.useState(200);
      const [cardIdx, setCardIdx] = React.useState(0);
      const viewportRef   = React.useRef(null);
      const [vpW, setVpW] = React.useState(0);
      const [ready, setReady] = React.useState(false);
      const [dragX, setDragX] = React.useState(0);
      const [isDragging, setIsDragging] = React.useState(false);
      const isDraggingRef = React.useRef(false);
      const touchX0 = React.useRef(null);
      const touchY0 = React.useRef(null);
      const [simCtaChecked, setSimCtaChecked] = React.useState(false);
      const [isHinting, setIsHinting] = React.useState(false);
      const hintedRef = React.useRef(false);

      const pickSpec = s => { setSpec(s); setCart(panierForSpec(s)); };
      const conv = convForSpec(spec, cart);

      const isMariage = spec === 'Mariage';
      const targets = isMariage ? [2, 5, 10, 20] : [10, 20, 30, 40, 50, 60];
      const aboFixe = isMariage
        ? { 2: 390, 5: 490, 10: 640, 20: 990 }
        : { 10: 390, 20: 490, 30: 570, 40: 650, 50: 720, 60: 790 };
      const cardsData = targets.map(clients => {
        const pub = Math.round(clients * CPL * 100 / conv);
        const revenue = clients * cart;
        const abo = aboFixe[clients] ?? calcAbo(pub);
        return { clients, pub, revenue, abo };
      });
      const cur = cardsData[cardIdx];

      // Mesure la largeur du viewport (pas des cartes — évite la dépendance circulaire flex-%)
      React.useEffect(() => {
        const measure = () => {
          if (!viewportRef.current) return;
          const w = viewportRef.current.offsetWidth;
          if (w > 0) { setVpW(w); setReady(true); }
        };
        measure();
        const ro = new ResizeObserver(measure);
        if (viewportRef.current) ro.observe(viewportRef.current);
        return () => ro.disconnect();
      }, []);

      // Calcul des dimensions depuis vpW (pas de % CSS pour éviter flex circulaire)
      const isMobileBp = vpW < 860;
      const cardW = vpW > 0 ? (isMobileBp ? vpW - 96 : Math.round(vpW * 0.38) - 8) : 0;
      const gap   = isMobileBp ? 16 : 36;
      const step  = cardW + gap;
      const centerOff = cardW > 0 ? (vpW - cardW) / 2 : 0;
      const trackX = centerOff - cardIdx * step + dragX;

      const navigateTo = idx => {
        if (idx < 0 || idx >= cardsData.length) return;
        setCardIdx(idx);
        setDragX(0);
        setIsDragging(false);
        isDraggingRef.current = false;
      };
      const prev = () => navigateTo(cardIdx - 1);
      const next = () => navigateTo(cardIdx + 1);

      const onTouchStart = e => {
        hintedRef.current = true;
        touchX0.current = e.touches[0].clientX;
        touchY0.current = e.touches[0].clientY;
        isDraggingRef.current = false;
        setDragX(0); setIsDragging(false);
      };
      const onTouchMove = e => {
        if (touchX0.current === null) return;
        const dx = e.touches[0].clientX - touchX0.current;
        const dy = e.touches[0].clientY - touchY0.current;
        if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 2) {
          isDraggingRef.current = true;
          setIsDragging(true);
          setDragX(dx);
        }
      };
      const onTouchEnd = e => {
        if (touchX0.current === null) return;
        const dx = e.changedTouches[0].clientX - touchX0.current;
        const was = isDraggingRef.current;
        isDraggingRef.current = false;
        setIsDragging(false); setDragX(0);
        if (was) {
          if (dx < -15) next(); else if (dx > 15) prev();
        } else {
          const t = e.changedTouches[0];
          const el = document.elementFromPoint(t.clientX, t.clientY);
          const cardEl = el && el.closest('.sim-track-card');
          if (cardEl && viewportRef.current) {
            const cards = viewportRef.current.querySelectorAll('.sim-track-card');
            const ci = Array.from(cards).indexOf(cardEl);
            if (ci !== -1 && ci !== cardIdx) navigateTo(ci);
          }
        }
        touchX0.current = null;
      };

      const onPointerDown = e => {
        hintedRef.current = true;
        if (e.pointerType === 'touch') return;
        if (e.button !== 0) return;
        const vp = e.currentTarget;
        vp.setPointerCapture(e.pointerId);
        isDraggingRef.current = false;
        const x0 = e.clientX;
        const idx0 = cardIdx;
        let dragged = false;
        const onMove = ev => {
          const dx = ev.clientX - x0;
          if (Math.abs(dx) > 2) {
            dragged = true; isDraggingRef.current = true;
            setIsDragging(true); setDragX(dx);
          }
        };
        const onUp = ev => {
          const dx = ev.clientX - x0;
          isDraggingRef.current = false; setIsDragging(false); setDragX(0);
          vp.removeEventListener('pointermove', onMove);
          vp.removeEventListener('pointerup', onUp);
          if (dragged) {
            if (dx < -15 && idx0 < cardsData.length - 1) navigateTo(idx0 + 1);
            else if (dx > 15 && idx0 > 0) navigateTo(idx0 - 1);
          } else {
            const cardEl = ev.target.closest('.sim-track-card');
            if (cardEl) {
              const cards = vp.querySelectorAll('.sim-track-card');
              const ci = Array.from(cards).indexOf(cardEl);
              if (ci !== -1 && ci !== idx0) navigateTo(ci);
            }
          }
        };
        vp.addEventListener('pointermove', onMove);
        vp.addEventListener('pointerup', onUp);
      };

      const go = id => e => { e.preventDefault(); const el = document.getElementById(id); if (el) window.scrollTo({top:el.offsetTop-60,behavior:'smooth'}); };
      React.useEffect(() => { if (window.lucide) window.lucide.createIcons(); });
      React.useEffect(() => {
        if (onSimChange) onSimChange({ spec, cart, pub: cur.pub, clients: cur.clients, revenue: cur.revenue, abo: cur.abo, volume: cur.pub / CPL, benefice: cur.revenue - cur.pub });
      }, [spec, cart, cardIdx]);

      // Hint swipe : double nudge en boucle jusqu'à interaction
      React.useEffect(() => {
        const section = document.getElementById('simulateur');
        if (!section) return;
        let loopTimer = null;
        const obs = new IntersectionObserver(([entry]) => {
          if (entry.isIntersecting && !hintedRef.current) {
            obs.disconnect();
            const oneNudge = (cb) => {
              if (hintedRef.current) return;
              setIsHinting(true);
              const duration = 500;
              const maxShift = -32;
              let start = null;
              const tick = (ts) => {
                if (hintedRef.current) { setDragX(0); setIsHinting(false); return; }
                if (!start) start = ts;
                const t = Math.min((ts - start) / duration, 1);
                setDragX(Math.sin(t * Math.PI) * maxShift);
                if (t < 1) requestAnimationFrame(tick);
                else { setDragX(0); setIsHinting(false); if (cb) cb(); }
              };
              requestAnimationFrame(tick);
            };
            const doubleNudge = (cb) => {
              oneNudge(() => {
                setTimeout(() => oneNudge(cb), 180);
              });
            };
            const loop = () => {
              if (hintedRef.current) return;
              doubleNudge(() => {
                loopTimer = setTimeout(loop, 2800);
              });
            };
            loopTimer = setTimeout(loop, 1800);
          }
        }, { threshold: 0.5 });
        obs.observe(section);
        return () => { obs.disconnect(); clearTimeout(loopTimer); };
      }, []);

      const trackStyle = {
        transform: `translateX(${trackX}px)`,
        transition: (isDragging || isHinting) ? 'none' : 'transform 0.44s cubic-bezier(0.34, 1.56, 0.64, 1)',
      };

      const cardStyle = cardW > 0 ? { flex: `0 0 ${cardW}px`, width: `${cardW}px` } : {};

      return (
        <section className="section" id="simulateur">
          <div className="container">
            <div className="section-head" style={{marginBottom:0}}>
              <div>
                <div className="eyebrow"><span className="rule"></span><span className="num">03</span><span>Simulateur</span></div>
                <h2>Publicité <em>Meta</em></h2>
              </div>
            </div>

            <div className="sim-pre">
              <div className="sim-pre-field">
                <span className="sim-field-lbl">Quelle prestation voulez-vous booster en publicité&nbsp;?</span>
                <div className="sim-chips">
                  {SIM_SPECIALITES.map(s => <button key={s} className={"sim-chip"+(spec===s?" active":"")} onClick={() => pickSpec(s)}>{s}</button>)}
                </div>
              </div>
              <div className="sim-pre-field">
                <span className="sim-field-lbl">Panier moyen par client</span>
                <div className="sim-input-wrap">
                  <input className="sim-input" type="number" min="0" step="10" value={cart}
                    onChange={e => { const v = parseInt(e.target.value,10); setCart(isNaN(v)?0:Math.max(0,v)); }}
                    onFocus={e => e.target.select()} />
                  <span className="sim-input-suffix">€</span>
                </div>
              </div>
            </div>

            <p className="sim-cards-lbl">Combien de clients voulez-vous par mois&nbsp;?</p>

            <div id="sim-cards-wrap" className={"sim-viewport" + (isDragging ? " is-dragging" : "")}
              ref={viewportRef}
              style={{ visibility: ready ? 'visible' : 'hidden' }}
              onTouchStart={onTouchStart}
              onTouchMove={onTouchMove}
              onTouchEnd={onTouchEnd}
              onPointerDown={onPointerDown}>
              <div className="sim-carousel-track" style={trackStyle}>
                {cardsData.map((card, i) => {
                  const active = i === cardIdx;
                  const dist = Math.abs(i - cardIdx);
                  return (
                    <div key={i}
                      className={"sim-track-card" + (active ? " stc-active" : " stc-inactive")}
                      style={{ ...cardStyle, opacity: Math.max(0.35, 1 - dist * 0.28) }}>
                      <div className="sim-card-main">
                        <div className="sim-card-top">
                          <span className="sim-card-plus">+</span>
                          <span className="sim-card-count">{card.clients}</span>
                        </div>
                        <div className="sim-card-count-lbl">clients par mois</div>
                        <div className="sim-card-ca">{fmtEUR(card.revenue)}</div>
                        <div className="sim-card-ca-lbl">de chiffre d'affaires</div>
                        <div className="sim-card-expand">
                          <div className="sim-card-divider"></div>
                          <div className="sim-card-costs">
                            <div className="sim-card-cost-row">
                              <i data-lucide="megaphone"></i>
                              <span><strong>{fmtEUR(card.pub)}</strong> de publicité / mois</span>
                            </div>
                            <div className="sim-card-cost-row">
                              <i data-lucide="plus-circle"></i>
                              <span><strong>{fmtEUR(card.abo)}</strong> de gestion et optimisation / mois</span>
                            </div>
                            <div className="sim-card-costs-sep"></div>
                            <div className="sim-card-cost-row sim-card-benefit">
                              <i data-lucide="trending-up"></i>
                              <span><span className="sim-card-benefit-val">{fmtEUR(card.revenue - card.pub - card.abo)}</span> de bénéfice net estimé</span>
                            </div>
                          </div>
                        </div>
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>

            <div className="sim-nav-row">
              <button className="sim-nav-btn sim-nav-prev" onClick={prev} disabled={cardIdx===0} aria-label="Précédent">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
              </button>
              <div className="sim-dots">
                {cardsData.map((card, i) => (
                  <button key={i} className={"sim-dot"+(i===cardIdx?" active":"")}
                    onClick={() => navigateTo(i)} aria-label={"+" + card.clients + " clients"}>
                  </button>
                ))}
              </div>
              <button className="sim-nav-btn sim-nav-next" onClick={next} disabled={cardIdx===cardsData.length-1} aria-label="Suivant">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
              </button>
            </div>

            <p className="sim-note">★ Estimations basées sur les résultats de mes clients photographes</p>

            <div className="sim-cta-wrap" style={{marginTop:36}}>
              <label className="sim-cta-check" onClick={e => { if (!simCtaChecked) { setSimCtaChecked(true); if (onClientConfirm) onClientConfirm(e.currentTarget); } }}>
                <input type="checkbox" className="sim-cta-input" checked={simCtaChecked} readOnly />
                <span className="sim-cta-box">{simCtaChecked ? '✓' : ''}</span>
                <span className="sim-cta-label">Je veux <strong>+{cur.clients} clients</strong> par mois</span>
              </label>
              {simCtaChecked && (
                <div className="sim-scroll-hint" aria-hidden="true">
                  <span>↓</span><span>↓</span><span>↓</span>
                </div>
              )}
            </div>
          </div>
        </section>
      );
    }
    // ─── Modal devis rapide ───────────────────────────────────────────────────
    function DevisModal({lpTier, onClose}) {

      const tierLabel = lpTier === 'decouverte' ? 'Découverte — 390€' : 'Complète — 490€';
      const tierValue = lpTier === 'decouverte' ? 390 : 490;

      const submit = async e => {
        e.preventDefault();
        setStatus('sending');
        try {
          const res = await fetch('https://api.web3forms.com/submit', {
            method: 'POST', headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
              access_key: '8ff579b2-c217-4683-95bf-49ccd0b57c4d',
              subject: `Devis landing page — ${form.prenom}`,
              'Prénom': form.prenom,
              'Téléphone': form.telephone,
              'Email': form.email,
              'Option choisie': tierLabel,
            })
          });
          const data = await res.json();
          setStatus(data.success ? 'success' : 'error');
          if (data.success && typeof fbq === 'function') {
            fbq('track', 'Lead', {
              content_name: 'Devis Landing Page',
              content_category: lpTier === 'decouverte' ? 'Découverte' : 'Complète',
              value: tierValue,
              currency: 'EUR',
            });
          }
        } catch { setStatus('error'); }
      };

      React.useEffect(() => {
        document.body.style.overflow = 'hidden';
        return () => { document.body.style.overflow = ''; };
      }, []);

      return (
        <div className="dmodal-backdrop" onClick={e => { if (e.target === e.currentTarget) onClose(); }}>
          <div className="dmodal-card" role="dialog" aria-modal="true">
            <button className="dmodal-close" aria-label="Fermer" onClick={onClose}>✕</button>
            {status === 'success' ? (
              <div className="dmodal-success">
                <div className="dmodal-success-ico">✓</div>
                <h3>Demande envoyée !</h3>
                <p>Je vous recontacte sous 24h.</p>
                <button className="btn btn-primary" onClick={onClose}>Fermer</button>

              <>
                <p className="dmodal-option">{tierLabel}</p>

                  <input className="dmodal-input" type="text" placeholder="Prénom" required value={form.prenom} onChange={update('prenom')} />
                  <input className="dmodal-input" type="tel" placeholder="Téléphone" required value={form.telephone} onChange={update('telephone')} />
                  <input className="dmodal-input" type="email" placeholder="Email" required value={form.email} onChange={update('email')} />
                  <button className="btn btn-primary dmodal-submit" type="submit" disabled={status==='sending'}>
                    {status === 'sending' ? 'Envoi…' : 'Envoyer'}
                  </button>
                  {status === 'error' && <p className="dmodal-err">Une erreur est survenue, réessayez.</p>}
                </form>
              </>
            )}
          </div>
        </div>
      );
    }

    // ─── Tunnel de vente ─────────────────────────────────────────────────────

                <label className={"offre-radio" + (lpChoice==='need' ? " active" : "")} onClick={e => onLpChoice('need', e.currentTarget)}>

    // ─── Formulaire de contact ────────────────────────────────────────────────
    const ICO_PATHS = {
      video:'Pm22 8-6 4 6 4V8Z|R2,6,14,12,2',
      clock:'C12,12,10|PM12 6v6l4 2',
      phone:'PM22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.99 5.18 2 2 0 0 1 6.97 3h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L11.05 10.91a16 16 0 0 0 6.29 6.29l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z',
      user:'PM19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2|C12,7,4',
      shield:'PM20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z|Pm9 12 2 2 4-4'
    };
    function Ico({n}) {
      const parts = (ICO_PATHS[n]||'').split('|');
      return (
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
          {parts.map((p,i) => {
            if (p.startsWith('C')) {const [,x,y,r]=p.split(',');return <circle key={i} cx={x} cy={y} r={r}/>;}
            if (p.startsWith('R')) {const [,x,y,w,h,rx]=p.split(',');return <rect key={i} x={x} y={y} width={w} height={h} rx={rx} ry={rx}/>;}
            return <path key={i} d={p.replace(/^P/,'')} />;
          })}
        </svg>
      );
    }
    function Callback({simData, lpChoice, clientsConfirmed, lpTier}) {
      const [form, setForm] = React.useState({prenom:'', telephone:'', email:''});
      const [status, setStatus] = React.useState('idle');
      const successRef = React.useRef(null);

      React.useEffect(() => {
        if (status === 'success' && successRef.current) {
          setTimeout(() => successRef.current.scrollIntoView({ behavior: 'smooth', block: 'center' }), 80);
        }
      }, [status]);

      const clients = clientsConfirmed ? (simData && simData.clients) : null;
      const tierLabel = lpTier === 'decouverte' ? 'Découverte' : 'Complète';
      const lpSentence = lpChoice === 'have'
        ? 'vous avez déjà une landing page'
        : lpChoice === 'need' ? `vous souhaitez une landing page ${tierLabel}`
        : null;

      const update = k => e => setForm(f => ({...f, [k]:e.target.value}));

      const submit = async e => {
        e.preventDefault();
        setStatus('sending');
        const sim = simData || {};
        const lpLabel = lpChoice === 'have' ? 'Possède déjà une landing page'
          : lpChoice === 'need' ? `Souhaite une landing page — ${tierLabel}`
          : '—';
        try {
          const res = await fetch('https://api.web3forms.com/submit', {
            method:'POST', headers:{'Content-Type':'application/json'},
            body: JSON.stringify({
              access_key: '8ff579b2-c217-4683-95bf-49ccd0b57c4d',
              subject: `Devis — ${form.prenom} (+${clients||'?'} clients)`,
              'Prénom': form.prenom,
              'Email': form.email,
              'Téléphone': form.telephone,
              'Clients souhaités': clients ? '+' + clients + ' /mois' : '—',
              'Spécialité (simulateur)': sim.spec || '—',
              'Budget pub estimé': sim.pub ? sim.pub + ' €/mois' : '—',
              'Landing page': lpLabel,
            })
          });
          const data = await res.json();
          setStatus(data.success ? 'success' : 'error');
          if (data.success && typeof fbq === 'function') fbq('track', 'Lead');
        } catch { setStatus('error'); }
      };

      return (
        <section className="section callback" id="rappel">
          <div className="container">
            <div className="cfw-head">
              <h2>Demande de devis — <em>sans engagement</em></h2>
              <p className="lede">Je vous recontacte sous 24h pour vous proposer une offre sur-mesure.</p>
              <div className="cb-assur">
                <span><Ico n="clock" /> Réponse sous <strong>24h</strong></span>
                <span><Ico n="phone" /> Appel de <strong>30 min</strong></span>
                <span><Ico n="shield" /> Aucun <strong>engagement</strong></span>
              </div>
            </div>

            {status === 'success' ? (
              <div className="cfw-success" ref={successRef}>
                <div className="cfw-success-ico">✓</div>
                <h3>Demande envoyée !</h3>
                <p>Je vous recontacte très bientôt. À très vite.</p>
              </div>
            ) : (
              <div className="cfw-simple">
                <form onSubmit={submit} noValidate className="cfw-contact-form">
                  <div className="cform-field">
                    <label className="cform-label">Prénom</label>
                    <input className="cform-input" type="text" required placeholder="Sophie" value={form.prenom} onChange={update('prenom')} />
                  </div>
                  <div className="cform-field">
                    <label className="cform-label">Téléphone</label>
                    <input className="cform-input" type="tel" required placeholder="06 12 34 56 78" value={form.telephone} onChange={update('telephone')} />
                  </div>
                  <div className="cform-field">
                    <label className="cform-label">Email</label>
                    <input className="cform-input" type="email" required placeholder="sophie@studio.fr" value={form.email} onChange={update('email')} />
                  </div>
                  {status === 'error' && <p className="cform-error">Une erreur est survenue, réessayez.</p>}
                  <button className="btn btn-gold cform-submit" type="submit" disabled={status==='sending'}>
                    {status==='sending' ? 'Envoi…' : 'Envoyer ma demande de devis →'}
                  </button>
                </form>
              </div>
            )}
          </div>
        </section>
      );
    }
    // ─── Contact WhatsApp ────────────────────────────────────────────────────
    function ContactWA() {
      return (
        <section className="section contact-wa" id="contact">
          <div className="container">
            <div className="cwa-inner">
              <p className="cwa-eyebrow">Contact direct</p>
              <h2 className="cwa-title">Une question avant de vous lancer&nbsp;?</h2>

                  <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/>
                  <path d="M12 0C5.373 0 0 5.373 0 12c0 2.123.554 4.117 1.528 5.845L.057 23.428a.5.5 0 0 0 .609.61l5.654-1.48A11.945 11.945 0 0 0 12 24c6.627 0 12-5.373 12-12S18.627 0 12 0zm0 21.9a9.893 9.893 0 0 1-5.031-1.371l-.36-.214-3.733.977.997-3.645-.235-.374A9.862 9.862 0 0 1 2.1 12C2.1 6.534 6.534 2.1 12 2.1c5.466 0 9.9 4.434 9.9 9.9 0 5.466-4.434 9.9-9.9 9.9z"/>
                </svg>
                Écrire sur WhatsApp
              </a>
            </div>
          </div>
        </section>
      );
    }

    // ─── Footer ───────────────────────────────────────────────────────────────
    function Footer() {
      const go = id => e => { e.preventDefault(); const el = document.getElementById(id); if (el) window.scrollTo({top:el.offsetTop-60,behavior:'smooth'}); };
      return (

            <div className="footer-bottom">

    }

    // ─── App ──────────────────────────────────────────────────────────────────
    function App() {
      const [simData, setSimData] = React.useState({});
      const [lpChoice, setLpChoice] = React.useState(null);
      const [lpTier, setLpTier] = React.useState('complete');
      const [clientsConfirmed, setClientsConfirmed] = React.useState(false);
      React.useEffect(() => { if (window.lucide) window.lucide.createIcons(); });
      React.useEffect(() => {
        if (window.location.hash) history.replaceState(null, '', window.location.pathname + window.location.search);
        window.scrollTo(0, 0);
      }, []);

      React.useEffect(() => {
        const targets = [
          ...document.querySelectorAll('.section:not(.hero) > .container > *:not(.offre-video-wrap)'),
          ...document.querySelectorAll('.meca-chip, .offre-price-card, .sim-res-card, .cfw-simple'),
        ];
        const io = new IntersectionObserver((entries) => {
          entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('sr-in'); io.unobserve(e.target); } });
        }, { threshold: 0.07, rootMargin: '0px 0px -30px 0px' });
        targets.forEach(el => { el.classList.add('sr-init'); io.observe(el); });
        return () => io.disconnect();
      }, []);

      const scrollTo = id => { const el = document.getElementById(id); if (el) window.scrollTo({top: el.offsetTop - 60, behavior: 'smooth'}); };

      const handleClientConfirm = sourceEl => {
        setClientsConfirmed(true);
        flyToPanel(sourceEl);
      };

      const handleLpChoice = (choice, sourceEl) => {
        setLpChoice(choice);
        flyToPanel(sourceEl);
      };

      return (
        <div className="page">
          <Nav />
          <SideRail />
          <NeedsPanel clients={clientsConfirmed ? simData.clients : null} lpChoice={lpChoice} />
          <main>
            <HeroWow variant="anime" />
            <Schema />
            <Simulateur onSimChange={setSimData} onClientConfirm={handleClientConfirm} />
            <Offre lpChoice={lpChoice} onLpChoice={handleLpChoice} lpTier={lpTier} onLpTier={setLpTier} />
            <Callback simData={simData} lpChoice={lpChoice} clientsConfirmed={clientsConfirmed} lpTier={lpTier} />
            <ContactWA />
            <Studio />
          </main>
          <Footer />
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>

  <!-- Meta Pixel — conversion tracking -->
  <script>
    (function () {
      var fire = function (name, params) { if (typeof fbq === 'function') fbq('track', name, params || {}); };
      var checkoutFired = false;
      document.addEventListener('click', function (e) {
        var a = e.target.closest && e.target.closest('a[href="#rappel"]');
        if (a && !checkoutFired) { checkoutFired = true; fire('InitiateCheckout', { content_name: 'Reservation appel' }); }
      }, true);
      var vcFired = false;
      var tries = 0;
      var poll = setInterval(function () {
        var sim = document.getElementById('simulateur');
        if (sim && 'IntersectionObserver' in window) {
          clearInterval(poll);
          new IntersectionObserver(function (entries) {
            entries.forEach(function (en) { if (en.isIntersecting && !vcFired) { vcFired = true; fire('ViewContent', { content_name: 'Simulateur ROI' }); } });
          }, { threshold: 0.4 }).observe(sim);
        } else if (++tries > 40) clearInterval(poll);
      }, 250);
    })();
  </script>
