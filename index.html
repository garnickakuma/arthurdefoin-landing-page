<!doctype html>
<html lang="fr">
<head>

  <link rel="icon" type="image/png" href="landing/assets/favicon.png">

  <link href="https://assets.calendly.com/assets/external/widget.css" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #FBF5EC;
      font-family: 'Jost', sans-serif;
      -webkit-font-smoothing: antialiased;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .card {
      width: 100%;

      padding: clamp(40px, 8vw, 80px) clamp(22px, 5vw, 48px) 0;
      display: flex;
      flex-direction: column;
      align-items: center;

    .photo {
      width: 120px;
      height: 120px;

      object-fit: cover;
      border: 2px solid #D9BE89;
      box-shadow: 0 10px 30px -8px rgba(43,34,27,.18);
    }

    .name {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 500;
      font-size: clamp(32px, 7vw, 48px);
      line-height: 1.05;
      letter-spacing: -0.01em;
      color: #14100D;
      margin: 24px 0 0;
    }

    .role {
      font-family: 'Jost', sans-serif;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #9A7B43;
      margin: 10px 0 0;
    }

    .divider {
      width: 40px;
      height: 1px;
      background: #D9BE89;
      margin: 28px auto;
    }

    .calendly-inline-widget {
      width: 100%;
      min-width: 280px;
      height: 700px;
    }
  </style>
</head>
<body>
  <div class="card">
    <img class="photo" src="esthetique/portrait.jpg" alt="Arthur Defoin">
    <h1 class="name">Arthur Defoin</h1>
    <p class="role">Media Buyer</p>

  <div style="width:100%;max-width:680px;padding:0 clamp(0px,2vw,24px)">

      class="calendly-inline-widget"
