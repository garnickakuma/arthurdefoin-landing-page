# Secrets à définir toi-même, ils ne passent jamais par le chat :
#   npx wrangler secret put STRIPE_SECRET_KEY      → sk_test_... puis sk_live_...
#   npx wrangler secret put STRIPE_WEBHOOK_SECRET  → whsec_...
#   npx wrangler secret put BREVO_API_KEY          → xkeysib-...
#   npx wrangler secret put ADMIN_MOT_DE_PASSE     → ton mot de passe d'administration
#   npx wrangler secret put AGENDA_TOKEN           → une suite de lettres au hasard, sert d'adresse secrète pour l'agenda Apple
#   npx wrangler secret put META_CAPI_TOKEN         → jeton de l'API Conversions (Gestionnaire d'événements > Paramètres > API Conversions)
